[package]
name = "featherghost"
version = "2.0.0"
edition = "2021"
description = "Feather Ghost : le copier-coller qui tape lettre par lettre"

[[bin]]
name = "FeatherGhost"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
raw-window-handle = "0.6"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.5"

[target.'cfg(not(windows))'.dependencies]
enigo = "0.2"
device_query = "2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
